# -- general -------------------------------------------------------------------

# `C-b C-a` to move to last active window.
bind-key C-a last-window

# Allow for faster key repitition.
set -s escape-time 0

# Allow multiple commands to be entered without pressing the prefix key again in the specified time milliseconds (the default is 500).
set -sg repeat-time 600

# Increase history limit
set -g history-limit 5000

# -- display -------------------------------------------------------------------

# Because the 0 key is all the way on the other side...
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
set -g set-titles on          # set terminal title
set -g status-interval 10     # redraw status line every 10 seconds

# -- navigation ----------------------------------------------------------------

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

set-window-option -g mode-keys vi

# Use v to trigger selection.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use y to yank current selection.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Make it easier to switch between panes with `C-b q <num>`.
set display-panes-time 4000

# -- colors -------------------------------------------------------------------

# Neo Vim recommends this.
-- set-option -g default-terminal "screen-256color"
-- set-option -sa terminal-overrides ',screen:RGB'

# Attempting to get true colors. Not quite working yet.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

